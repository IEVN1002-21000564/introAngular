<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <div class="mb-3">
                    <form>
                        <div class="form-group pt-4">
                            <label for="num1">Número 1:</label>
                            <input [(ngModel)]="num1" name="num1" type="text" class="form-control" id="num1"
                            placeholder="Ingrese número 1">
                        </div>
                        <div class="form-group pt-4">
                            <label for="num2">Número 2</label>
                            <input [(ngModel)]="num2" name="num2" type="text" class="form-control" id="num2"
                            placeholder="Ingrese número 2">
                        </div>
                        <br>
                       
                        <input type="radio" name="operacion" [(ngModel)]="opcion" value="1"> Suma
                        <input type="radio" name="operacion" [(ngModel)]="opcion" value="2"> Restar
                        <input type="radio" name="operacion" [(ngModel)]="opcion" value="3"> Multiplicar
                        <input type="radio" name="operacion" [(ngModel)]="opcion" value="4"> Dividir
 
                        <br><br>
                        <button type="button" (click)="calcular()" class="btn btn-primary">Calculadora</button>
                        
                        <!-- Resultado movido aquí abajo -->
                        <div class="mt-3">
                            <h3>Resultado: {{resultado}}</h3>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <p>operas-bas works!</p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
</head>
<body>
<div class="container">
  <div class="row">
    <div class="col-6">
      <div class="mb-3">
        <h3>Distancia entre dos puntos</h3>
        <form>
          <div class="form-group pt-4">
            <label for="x1">X 1</label>
            <input [(ngModel)]="x1" name="x1" type="text" class="form-control" id="x1" placeholder="Ingrese punto X1"/>
          </div>
          <div class="form-group pt-4">
            <label for="y1">Y 1</label>
            <input [(ngModel)]="y1" name="y1" type="text" class="form-control" id="y1" placeholder="Ingrese punto Y1"/>
          </div>
          <div class="form-group pt-4">
            <label for="x2">X 2</label>
            <input [(ngModel)]="x2" name="x2" type="text" class="form-control" id="x2" placeholder="Ingrese punto X2"/>
          </div>
          <div class="form-group pt-4">
            <label for="y2">Y 2</label>
            <input [(ngModel)]="y2" name="y2" type="text" class="form-control" id="y2" placeholder="Ingrese punto Y2"/>
          </div>
          <br>
          <button type="button" class="btn btn-primary" (click)="calcularDis()">
            Calcular
          </button>
        </form>
      </div>
    </div>
    <div class="col-6">
      <h3>Resultado: {{resultado}}</h3>
    </div>
  </div>
</div>
</body>
</html>
